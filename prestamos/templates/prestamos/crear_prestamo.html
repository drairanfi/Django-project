{% extends "base.html" %}

{% block title %}Prestar {{ libro.titulo }}{% endblock %}

{% block content %}
    <div class="card">
        <h2>Prestar: {{ libro.titulo }}</h2>

        {% if mensaje %}
            <p class="msg">{{ mensaje }}</p>
        {% endif %}

        {% if libro.disponible %}
            <form method="post">
                {% csrf_token %}
                <label for="lector_id">Elegí el lector:</label>
                <select name="lector_id" id="lector_id" required>
                    {% for lector in lectores %}
                        <option value="{{ lector.id }}">{{ lector.nombre }}</option>
                    {% endfor %}
                </select>
                <button class="btn" type="submit">Confirmar préstamo</button>
            </form>
        {% else %}
            <p>Este libro no está disponible.</p>
        {% endif %}
    </div>
{% endblock %}
