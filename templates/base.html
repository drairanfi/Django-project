<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Biblioteca{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: #f4f4f5; color: #18181b; }
        header { background: #1e293b; color: #fff; padding: 1rem 2rem; }
        header h1 { font-size: 1.4rem; }
        nav { margin-top: .5rem; }
        nav a { color: #cbd5e1; margin-right: 1.2rem; text-decoration: none; }
        nav a:hover { color: #fff; }
        main { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
        .card { background: #fff; border-radius: 10px; padding: 1.2rem; margin-bottom: 1rem; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
        .btn { display: inline-block; background: #2563eb; color: #fff; padding: .45rem .9rem; border-radius: 6px; text-decoration: none; margin-top: .5rem; }
        .btn:hover { background: #1d4ed8; }
        .tag { background: #e0e7ff; color: #3730a3; padding: .15rem .6rem; border-radius: 999px; font-size: .8rem; margin-right: .4rem; }
        .msg { background: #dcfce7; color: #166534; padding: .8rem; border-radius: 8px; margin-bottom: 1rem; }
        table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; }
        th, td { text-align: left; padding: .6rem .8rem; border-bottom: 1px solid #e4e4e7; }
        th { background: #f8fafc; }
        ul { list-style: none; }
        li { padding: .4rem 0; }
        footer { text-align: center; padding: 1rem; color: #71717a; font-size: .85rem; }
    </style>
</head>
<body>
    <header>
        <h1>Biblioteca Comunitaria</h1>
        <nav>
            <a href="{% url 'libros:inicio' %}">Inicio</a>
            <a href="{% url 'prestamos:lista_lectores' %}">Lectores</a>
            <a href="{% url 'prestamos:prestamos_por_estado' 'activo' %}">Préstamos activos</a>
            <a href="/admin/">Admin</a>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>Proyecto Django - Biblioteca Comunitaria</footer>
</body>
</html>
